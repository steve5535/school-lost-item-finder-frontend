<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>분실물 등록</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/user.css" />
    <script src="../js/common.js" defer></script>
    <script src="../js/user/register.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/index.html" class="site-logo">
        <img src="/images/school-logo.png" alt="학교 로고" />
        <span>창원 문성고등학교 분실물 관리</span>
      </a>
    </header>
    <main>
      <a href="/index.html">← 목록으로</a>
      <h1>분실물 등록</h1>
      <p>등록된 분실물은 관리자 확인 후 정식 분실물로 등록됩니다.</p>
      <form id="temporary-item-register-form">
        <label for="item-name">분실물 이름</label>
        <input id="item-name" name="itemName" type="text" required />
        <label for="item-detail">분실물 특징</label>
        <textarea id="item-detail" name="itemDetail" required></textarea>
        <label for="item-place">찾은 장소</label>
        <input id="item-place" name="itemPlace" type="text" required />
        <label>분실물 사진</label>
        <div class="image-mode-tabs">
          <button
            type="button"
            id="file-mode-button"
            class="image-mode-tab active"
          >
            📁 파일 선택
          </button>
          <button type="button" id="camera-mode-button" class="image-mode-tab">
            📷 사진 찍기
          </button>
        </div>
        <div id="file-mode-container">
          <input id="item-img" name="itemImg" type="file" accept="image/*" />
        </div>
        <div id="camera-container" hidden>
          <video id="camera-video" autoplay playsinline></video>
          <div class="camera-buttons">
            <button type="button" id="take-picture-button">📸 촬영</button>

            <button type="button" id="close-camera-button">취소</button>
          </div>
        </div>
        <canvas id="camera-canvas" hidden></canvas>
        <p id="selected-image-name"></p>
        <button type="submit">등록하기</button><a href="/index.html">취소</a>
      </form>
    </main>
  </body>
</html>
