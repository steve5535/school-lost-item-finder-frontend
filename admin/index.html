<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 - 분실물 관리</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="icon" type="image/png" href="/images/school-logo.png" />
    <script src="../js/common.js" defer></script>
    <script src="../js/admin/index.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/admin/index.html">관리자 화면</a>
      <nav>
        <a href="/index.html">일반 사용자 화면</a>
        <button id="logout-button" type="button">로그아웃</button>
      </nav>
    </header>
    <main>
      <section>
        <h1>분실물 관리</h1>
        <form id="admin-search-form">
          <label for="admin-search">분실물 검색</label>
          <input
            id="admin-search"
            name="keyword"
            type="search"
            placeholder="분실물 이름이나 특징을 입력하세요"
          />
          <button type="submit">검색</button>
        </form>
      </section>
      <section>
        <h2>임시 저장소</h2>
        <div id="temporary-item-list"></div>
      </section>
      <section>
        <h2>정식 분실물</h2>
        <div id="admin-item-list">
          <article class="item-card" data-item-id="">
            <a href="/admin/item-detail.html?id=">
              <div class="item-image">분실물 사진</div>
              <h3>분실물 이름</h3>
              <p>찾은 장소</p>
              <p>등록된 시간</p>
            </a>
          </article>
        </div>
      </section>
      <section>
        <h2>가져가기 완료된 분실물</h2>
        <div id="taken-item-list"></div>
      </section>
      <section>
        <h2>거절된 분실물</h2>
        <div id="declined-item-list"></div>
      </section>
      <section id="student-management">
        <h2>학생 관리</h2>
        <form id="student-excel-form">
          <label for="student-excel">학생 명단 엑셀 파일</label>
          <input
            id="student-excel"
            name="file"
            type="file"
            accept=".xlsx,.xls"
            required
          />
          <button type="submit">엑셀 업로드</button>
        </form>
        <hr />
        <form id="student-add-form">
          <label for="student-number">학번</label>
          <input
            id="student-number"
            name="studentNumber"
            type="text"
            inputmode="numeric"
            required
          />
          <label for="student-name">이름</label>
          <input id="student-name" name="studentName" type="text" required />
          <button type="submit">학생 추가</button>
        </form>
      </section>
    </main>
  </body>
</html>
