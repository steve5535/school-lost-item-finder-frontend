<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 - 분실물 상세</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <script src="../js/common.js" defer></script>
    <script src="../js/admin/item-detail.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/admin/index.html" class="site-logo">
        <img src="/images/school-logo.png" alt="학교 로고" />
        <span>창원 문성고등학교 분실물 관리</span>
      </a>
    </header>
    <main>
      <a href="/admin/index.html">← 목록으로</a>
      <article id="admin-item-detail" data-item-id="">
        <div class="item-image">
          <img id="item-image" alt="분실물 사진" />
        </div>
        <h1 id="item-name">분실물 이름</h1>
        <dl>
          <dt>찾은 장소</dt>
          <dd id="item-place">-</dd>
          <dt>특징</dt>
          <dd id="item-detail-text">-</dd>
          <dt>등록된 시간</dt>
          <dd id="item-sign-up-at">-</dd>
          <dt>수령 시간</dt>
          <dd id="item-take-at">-</dd>
          <dt>수령 학생</dt>
          <dd id="item-student">-</dd>
        </dl>
        <div>
          <button id="edit-item-button" type="button">수정</button>
          <button id="delete-item-button" type="button">삭제</button>
          <button id="cancel-take-button" type="button" hidden>
            수령 취소
          </button>
        </div>
      </article>
      <section id="edit-item-section" hidden>
        <h2>분실물 수정</h2>
        <form id="edit-item-form">
          <label for="edit-item-name">분실물 이름</label>
          <input id="edit-item-name" name="itemName" type="text" required />
          <label for="edit-item-detail">분실물 특징</label>
          <textarea id="edit-item-detail" name="itemDetail" required>
          </textarea>
          <label for="edit-item-place">찾은 장소</label>
          <input id="edit-item-place" name="itemPlace" type="text" required />
          <label>분실물 사진</label>
          <div class="image-mode-tabs">
            <button
              type="button"
              id="edit-file-mode-button"
              class="image-mode-tab active"
            >
              📁 파일 선택
            </button>
            <button
              type="button"
              id="edit-camera-mode-button"
              class="image-mode-tab"
            >
              📷 사진 찍기
            </button>
          </div>
          <div id="edit-file-mode-container">
            <input
              id="edit-item-img"
              name="itemImg"
              type="file"
              accept="image/*"
            />
          </div>
          <div id="edit-camera-container" hidden>
            <video id="edit-camera-video" autoplay playsinline></video>
            <div class="camera-buttons">
              <button type="button" id="edit-take-picture-button">
                📸 촬영
              </button>
              <button type="button" id="edit-close-camera-button">취소</button>
            </div>
          </div>
          <canvas id="edit-camera-canvas" hidden></canvas>
          <div id="edit-image-preview-container" hidden>
            <img id="edit-image-preview" alt="선택한 사진 미리보기" />
            <p id="edit-selected-image-name"></p>
            <button type="button" id="edit-remove-image-button">
              사진 삭제
            </button>
          </div>
          <div class="form-buttons">
            <button type="submit">수정 완료</button>
            <a href="/index.html" class="cancel-button">취소</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
